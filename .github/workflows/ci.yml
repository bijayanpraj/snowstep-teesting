name: Build and deploy Snowstep

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'snowstep-production' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      CFN_STACK_NAME: ${{ vars.CFN_STACK_NAME }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build frontend
        run: |
          npm install --prefix frontend
          npm run build --prefix frontend

      - name: Check backend
        run: |
          npm ci --prefix backend
          node --check backend/index.js
          node --check backend/server.js
          node --check backend/seed.js

      - name: Prepare release archive
        run: |
          tar -czf "$RUNNER_TEMP/snowstep-release.tar.gz" \
            --exclude='backend/node_modules' \
            --exclude='backend/.env*' \
            --exclude='backend/api' \
            --exclude='backend/vercel.json' \
            --exclude='backend/.gitignore' \
            backend frontend/dist infra/nginx-snowstep.conf infra/deploy-instance.sh
          echo "RELEASE_ID=${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Validate deployment settings and AWS credentials
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AUTH_TOKEN_SECRET: ${{ secrets.AUTH_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || { echo "::error::Set the AWS_REGION repository variable."; exit 1; }
          test -n "$CFN_STACK_NAME" || { echo "::error::Set the CFN_STACK_NAME repository variable."; exit 1; }
          [[ "$AWS_REGION" =~ ^[a-z0-9-]+$ ]] || { echo "::error::AWS_REGION contains unsupported characters."; exit 1; }
          [[ "$CFN_STACK_NAME" =~ ^[A-Za-z][A-Za-z0-9-]{0,127}$ ]] || { echo "::error::CFN_STACK_NAME must start with a letter and contain only letters, numbers, or hyphens."; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::Set the AWS_ACCESS_KEY_ID repository secret."; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::Set the AWS_SECRET_ACCESS_KEY repository secret."; exit 1; }
          test -n "$AWS_SESSION_TOKEN" || { echo "::error::Set the AWS_SESSION_TOKEN repository secret for temporary AWS credentials."; exit 1; }
          test -n "$MONGODB_URI" || { echo "::error::Set the MONGODB_URI repository secret."; exit 1; }
          test "${#AUTH_TOKEN_SECRET}" -ge 32 || { echo "::error::AUTH_TOKEN_SECRET must be at least 32 characters."; exit 1; }
          case "$MONGODB_URI" in
            mongodb://*|mongodb+srv://*) ;;
            *) echo "::error::MONGODB_URI must be a MongoDB connection string."; exit 1 ;;
          esac
          aws sts get-caller-identity >/dev/null

      - name: Discover default VPC and subnet
        id: network
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          VPC_ID="$(aws ec2 describe-vpcs \
            --filters Name=isDefault,Values=true \
            --query 'Vpcs[0].VpcId' --output text)"
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "::error::No default VPC is available in $AWS_REGION."
            exit 1
          fi
          SUBNET_ID="$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=default-for-az,Values=true" \
            --query 'sort_by(Subnets, &SubnetId)[0].SubnetId' --output text)"
          if [ -z "$SUBNET_ID" ] || [ "$SUBNET_ID" = "None" ]; then
            echo "::error::No default subnet is available in $AWS_REGION."
            exit 1
          fi
          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"
          echo "subnet_id=$SUBNET_ID" >> "$GITHUB_OUTPUT"

      - name: Create or update CloudFormation stack
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          VPC_ID: ${{ steps.network.outputs.vpc_id }}
          SUBNET_ID: ${{ steps.network.outputs.subnet_id }}
        run: |
          aws cloudformation deploy \
            --template-file infra/ec2-instance.yaml \
            --stack-name "$CFN_STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              VpcId="$VPC_ID" \
              SubnetId="$SUBNET_ID"

      - name: Deploy application over temporary SSH access
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AUTH_TOKEN_SECRET: ${{ secrets.AUTH_TOKEN_SECRET }}
        run: |
          set -euo pipefail

          KEY_FILE="$RUNNER_TEMP/snowstep-deploy-key.pem"
          KNOWN_HOSTS="$RUNNER_TEMP/snowstep-known-hosts"
          SECURITY_GROUP_ID=""
          RUNNER_CIDR=""

          cleanup() {
            if [ -n "$SECURITY_GROUP_ID" ] && [ -n "$RUNNER_CIDR" ]; then
              aws ec2 revoke-security-group-ingress \
                --group-id "$SECURITY_GROUP_ID" \
                --protocol tcp --port 22 --cidr "$RUNNER_CIDR" >/dev/null 2>&1 || true
            fi
            rm -f "$KEY_FILE" "$KNOWN_HOSTS"
          }
          trap cleanup EXIT

          STACK_OUTPUTS="$(aws cloudformation describe-stacks \
            --stack-name "$CFN_STACK_NAME" \
            --query 'Stacks[0].Outputs' --output json)"
          ARTIFACT_BUCKET="$(jq -r '.[] | select(.OutputKey == "ArtifactBucketName") | .OutputValue // empty' <<< "$STACK_OUTPUTS")"
          INSTANCE_ID="$(jq -r '.[] | select(.OutputKey == "InstanceId") | .OutputValue // empty' <<< "$STACK_OUTPUTS")"
          PUBLIC_IP="$(jq -r '.[] | select(.OutputKey == "PublicIp") | .OutputValue // empty' <<< "$STACK_OUTPUTS")"
          PUBLIC_URL="$(jq -r '.[] | select(.OutputKey == "PublicUrl") | .OutputValue // empty' <<< "$STACK_OUTPUTS")"
          SECURITY_GROUP_ID="$(jq -r '.[] | select(.OutputKey == "SecurityGroupId") | .OutputValue // empty' <<< "$STACK_OUTPUTS")"
          PRIVATE_KEY_PARAMETER="$(jq -r '.[] | select(.OutputKey == "PrivateKeyParameter") | .OutputValue // empty' <<< "$STACK_OUTPUTS")"
          if [ -z "$ARTIFACT_BUCKET" ] || [ -z "$INSTANCE_ID" ] || [ -z "$PUBLIC_IP" ] || [ -z "$PUBLIC_URL" ] || [ -z "$SECURITY_GROUP_ID" ] || [ -z "$PRIVATE_KEY_PARAMETER" ]; then
            echo "::error::CloudFormation did not return all required deployment outputs."
            exit 1
          fi
          echo "EC2 Elastic IP: $PUBLIC_IP (add it to the MongoDB Atlas IP access list)"
          echo "Storefront URL: $PUBLIC_URL"

          aws ssm put-parameter \
            --name "/$CFN_STACK_NAME/MONGODB_URI" \
            --type SecureString --value "$MONGODB_URI" --overwrite >/dev/null
          aws ssm put-parameter \
            --name "/$CFN_STACK_NAME/AUTH_TOKEN_SECRET" \
            --type SecureString --value "$AUTH_TOKEN_SECRET" --overwrite >/dev/null
          aws s3 cp "$RUNNER_TEMP/snowstep-release.tar.gz" \
            "s3://$ARTIFACT_BUCKET/releases/$RELEASE_ID.tar.gz"

          for attempt in $(seq 1 60); do
            PING_STATUS="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text)"
            if [ "$PING_STATUS" = "Online" ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::EC2 did not register as an online Systems Manager managed instance."
              exit 1
            fi
            sleep 10
          done

          HOST_KEY_COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["ssh-keygen -A && cat /etc/ssh/ssh_host_ed25519_key.pub"]}' \
            --query 'Command.CommandId' --output text)"
          HOST_KEY_STATUS="Pending"
          for attempt in $(seq 1 36); do
            HOST_KEY_STATUS="$(aws ssm list-command-invocations \
              --command-id "$HOST_KEY_COMMAND_ID" --no-details \
              --query 'CommandInvocations[0].Status' --output text)"
            if [ "$HOST_KEY_STATUS" = "None" ]; then
              HOST_KEY_STATUS="Pending"
            fi
            case "$HOST_KEY_STATUS" in
              Success) break ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$HOST_KEY_COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac
            sleep 5
          done
          if [ "$HOST_KEY_STATUS" != "Success" ]; then
            echo "::error::Timed out retrieving the EC2 SSH host key through Systems Manager."
            exit 1
          fi
          HOST_PUBLIC_KEY="$(aws ssm get-command-invocation \
            --command-id "$HOST_KEY_COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text)"
          HOST_KEY_LINE="$(awk '{print $1 " " $2}' <<< "$HOST_PUBLIC_KEY")"
          case "$HOST_KEY_LINE" in
            ssh-ed25519\ *) ;;
            *) echo "::error::EC2 did not return a valid SSH host key."; exit 1 ;;
          esac
          printf '%s %s\n' "$PUBLIC_IP" "$HOST_KEY_LINE" > "$KNOWN_HOSTS"

          aws ssm get-parameter \
            --name "$PRIVATE_KEY_PARAMETER" \
            --with-decryption \
            --query 'Parameter.Value' --output text > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh-keygen -y -f "$KEY_FILE" >/dev/null

          RUNNER_IP="$(curl --fail --silent https://checkip.amazonaws.com | tr -d '[:space:]')"
          [[ "$RUNNER_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Could not determine the GitHub runner's public IPv4 address."
            exit 1
          }
          RUNNER_CIDR="${RUNNER_IP}/32"
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR" >/dev/null 2>&1 || true
          aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR" >/dev/null

          install -m 700 -d "$HOME/.ssh"
          SSH_OPTS=(-i "$KEY_FILE" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS" -o ConnectTimeout=5)
          SSH_READY=0
          for attempt in $(seq 1 36); do
            if ssh "${SSH_OPTS[@]}" "ubuntu@$PUBLIC_IP" true >/dev/null 2>&1; then
              SSH_READY=1
              break
            fi
            sleep 10
          done
          if [ "$SSH_READY" -ne 1 ]; then
            echo "::error::Could not connect to EC2 over SSH after opening temporary runner access."
            exit 1
          fi

          REMOTE_ARCHIVE="/tmp/snowstep-release-${RELEASE_ID}.tar.gz"
          scp "${SSH_OPTS[@]}" "$RUNNER_TEMP/snowstep-release.tar.gz" \
            "ubuntu@$PUBLIC_IP:$REMOTE_ARCHIVE"
          ssh "${SSH_OPTS[@]}" "ubuntu@$PUBLIC_IP" \
            "sudo bash -s -- '$CFN_STACK_NAME' '$PUBLIC_URL' '$RELEASE_ID' '$AWS_REGION' '$REMOTE_ARCHIVE'" <<'REMOTE'
          set -euo pipefail
          stack_name="$1"
          public_url="$2"
          release_id="$3"
          region="$4"
          archive="$5"

          mkdir -p /tmp/snowstep-release
          tar -xzf "$archive" -C /tmp/snowstep-release
          rm -f "$archive"
          bash /tmp/snowstep-release/infra/deploy-instance.sh \
            "$stack_name" "$public_url" "$release_id" "$region"
          REMOTE

          PUBLIC_HEALTH_OK=0
          for attempt in $(seq 1 36); do
            if curl --fail --silent --max-time 15 "$PUBLIC_URL/api/health" \
              | grep -q '"database":"connected"'; then
              PUBLIC_HEALTH_OK=1
              break
            fi
            sleep 10
          done
          if [ "$PUBLIC_HEALTH_OK" -ne 1 ]; then
            echo "::error::Public health check failed at $PUBLIC_URL/api/health."
            exit 1
          fi

          echo "Deployed to $PUBLIC_URL"
