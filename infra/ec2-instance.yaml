AWSTemplateFormatVersion: "2010-09-09"
Description: Optional Snowstep EC2 host without IAM roles or instance profiles.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the Snowstep instance.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with automatic public IPv4 assignment and an internet gateway route.
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair name. This template does not create or store keys.
  SshCidr:
    Type: String
    Description: Trusted IPv4 CIDR permitted to SSH to a newly provisioned instance.
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$
  UbuntuAmiId:
    Type: AWS::EC2::Image::Id
    Description: Ubuntu 24.04 LTS AMD64 AMI ID for the selected region.

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP storefront and SSH from the specified trusted CIDR.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  SnowstepInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: t2.micro
      KeyName: !Ref KeyPairName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee -a /var/log/snowstep-bootstrap.log | logger -t snowstep-bootstrap -s 2>/dev/console) 2>&1
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y ca-certificates curl git gnupg nginx openssh-server
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
            | gpg --dearmor --yes -o /etc/apt/keyrings/nodesource.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
            > /etc/apt/sources.list.d/nodesource.list
          apt-get update
          apt-get install -y nodejs
          npm install --global pm2@5

          ssh-keygen -A
          systemctl enable --now ssh
          systemctl enable --now nginx

          install -d -o ubuntu -g ubuntu /var/www
          if [ ! -d /var/www/snowstep/.git ]; then
            sudo -u ubuntu git clone --branch main --single-branch \
              https://github.com/bijayanpraj/snowstep-teesting.git \
              /var/www/snowstep
          fi
          chown -R ubuntu:ubuntu /var/www/snowstep

Outputs:
  PublicIP:
    Description: Public IPv4 address of the optional EC2 instance.
    Value: !GetAtt SnowstepInstance.PublicIp
  PublicURL:
    Description: HTTP URL of the Snowstep storefront.
    Value: !Sub "http://${SnowstepInstance.PublicIp}"
  InstanceId:
    Description: EC2 instance ID.
    Value: !Ref SnowstepInstance
  SecurityGroupId:
    Description: Security group for the optional EC2 instance.
    Value: !Ref WebSecurityGroup
