server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/snowstep/current/frontend/dist;
    index index.html;
    client_max_body_size 10m;

    location = /api {
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
    }

    location = /shoe {
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
    }

    location ^~ /shoe/ {
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
